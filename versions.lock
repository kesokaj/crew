INSTALL_TEST_REGISTRY_IMAGE=registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
# The check image's govulncheck (tools/check-image/Dockerfile, design 16.12), for a release's security
