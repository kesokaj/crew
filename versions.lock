# Every version Crew is built from. One KEY=VALUE per line, so that a shell,
# Docker Compose, and an image build can all read it.
#
# These first values are what the reference project ran when the plan was
# written. Milestone M0 checks them against the machine (spike item 63).
# Where the machine differs, the machine's value wins, and the spike says so.
# Nothing else in the repository names a version, except the few places a
# tool insists on, and `make check` compares those with this file.
#
# What M0 adds:
#   1. A checksum or an image hash for every entry that has only a version:
#      the runtime's Go and Node, tofu, yq, hadolint, chrome-devtools-mcp,
#      and claude (taken out again in design 0.42: agy is the only CLI).
#   2. The version agy has on the machine, as a comment, since agy was taken
#      to have no numbered download (design 12.8; pinned since 0.56, below).
# What M1 added, when the images were first built:
#   3. The PostgreSQL image, and the Node image that builds the UI.
#   4. The tools of the runtime image that come from a package source in
#      which a version can be asked for: Docker, gh, gcloud, kubectl (design
#      12.8). Their packages are checked by the source's signed index. Docker's
#      and Google's keep older versions; GitHub's keeps only its newest, so the
#      gh pin breaks every build when gh releases, until it is moved. Chromium and Python
#      come from Debian's archive, which keeps only the current version, so
#      the image records them in /crew/versions.json.

# The number of the machine setup. A release that needs a newer one says so. 2: the data folder has
# canonical/, the canonical repositories (M4). 3: it has builds/, the server's, and the firewall has
# the rules of src-, the Sources mode of a release's build (M16). 4: the machine's own security updates
# for the security origin alone, and crew-restart.timer with its service (M17). 5: Kata 4.3.1 in
# /opt/kata-4.3.1 beside the one before, Docker's runtime mvm naming its shim and ConfigPath (M17). 6:
# the firewall has the rules of app- and apo-, a hosted project's bridges (M19).
MACHINE_SETUP=6

# --- the machine --------------------------------------------------------------
DOCKER_VERSION=29.9.2
# Kata's static release, runtime-rs only (the Go runtime is the separate kata-go-static, deprecated since
# 4.0), by the digest GitHub gives the asset (design 13.2; read on 2026-10-24).
KATA_VERSION=4.3.1
KATA_SHA256=1463a2b86845f4d3d8e87f2f764ec59856fc0fee3520967a79ade32762be2e97

# --- the server image ---------------------------------------------------------
# Go 1.27, not the 1.25 of styrman-crew: Go supports its two newest lines only, and 1.25 left that in
# August 2026. The ingress replaces caddy-builder's SDK from GO_IMAGE so server and ingress share 1.27.4.
GO_VERSION=1.27.4
GO_IMAGE=golang:1.27.4-trixie@sha256:f18c3d73a184fb0582828510722e723b63a93f7188d11dd223d9be6f6880e65d
SERVER_BASE_IMAGE=debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2

# --- the UI, built into the server's image -------------------------------------
WEB_NODE_VERSION=22.23.4
WEB_NODE_IMAGE=node:22.23.4-trixie-slim@sha256:be1e2a3dc2c4fd68cdfadad2a696a280e0d2749098bee509230174d72fb768c6

# --- the ingress --------------------------------------------------------------
CADDY_VERSION=2.11.7
CADDY_BUILDER_IMAGE=caddy:2.11.7-builder@sha256:c4cd20eaa0b69112fd5d4f721ffc9671687e1d5d0b155c8620cf7546dbef94c0
CADDY_IMAGE=caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e

# --- the database -------------------------------------------------------------
# The current major version at M1 (2026-10-13; 19 is still a beta), by its image hash.
POSTGRES_IMAGE=postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42

# --- the runtime image, which every sandbox runs ------------------------------
RUNTIME_BASE_IMAGE=debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
# The checksums are the publishers' own, as styrman-crew's image checks them
# at 5c9e6fb. The npm entries are the registry's integrity of the package.
RUNTIME_GO_VERSION=1.27.4
RUNTIME_GO_SHA256=7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840
RUNTIME_NODE_VERSION=22.23.4
RUNTIME_NODE_SHA256=1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce
TOFU_VERSION=1.13.1
TOFU_SHA256=8ccbc6f8ee21d2827715f3c6e08a9b3e0209b1e62057c05067ef117e047c1a80
YQ_VERSION=4.54.1
YQ_SHA256=8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
HADOLINT_VERSION=2.15.1
HADOLINT_SHA256=c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
CHROME_DEVTOOLS_MCP_VERSION=1.12.0
CHROME_DEVTOOLS_MCP_INTEGRITY=sha512-lAGpH0zXT1ZdaPefP1KK/MvxwihOlu7VGQ7p4wbhD9OhN17vUC4KWk/ImUYR9DE4s+7r4r0ySV4xr2OkTa7ZMA==
# From the package sources of Docker, GitHub, and Google (12.8). Docker's and Google's keep older
# versions; GitHub's keeps only its newest: 2.102.0 was gone on 2026-10-21, and a build failed on it.
RUNTIME_DOCKER_CE_VERSION=5:29.9.0-1~debian.13~trixie
RUNTIME_CONTAINERD_VERSION=2.4.1-2~debian.13~trixie
RUNTIME_BUILDX_VERSION=0.38.0-1~debian.13~trixie
RUNTIME_COMPOSE_VERSION=5.6.0-1~debian.13~trixie
# The fingerprint of the key that signs Docker's packages, which the updater's image checks (16.4).
DOCKER_APT_KEY_FINGERPRINT=9DC858229FC7DD38854AE2D88D81803C0EBFCD88
RUNTIME_GH_VERSION=2.103.3
RUNTIME_GCLOUD_VERSION=588.0.0-0
RUNTIME_KUBECTL_VERSION=1:588.0.0-0
# The agent CLI, agy, the only one since design 0.42: the tarball its vendor's manifest names, with
# the manifest's sha512 (design 12.8, since 0.56; before that each image took the newest on its build
# day). The address names the version; tools/check-versions.py checks that it does. The build does
# not download it: Crew's server, or crew-ctl on the machine, downloads it from this address alone,
# checks its sha512, and gives it to the runtime image's build as its context agy (since 0.57).
AGY_VERSION=1.5.6
AGY_URL=https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.6-6212266538958848/linux-x64/cli_linux_x64.tar.gz
AGY_SHA512=0c67824908caf9cc3156699802b8097f2fd02c4608ae9293c9aa7f17e1bcd342c4b9c2e158388253a37804ef6bd9c6b1d25cfaca3c07bbb7587378fc91839bb4

# --- the install test (design 16.11, 22): a fresh virtual machine on this machine ----------------
