*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700;line-height:1.15}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.mono{font-family:var(--font-m);font-size:12px}
.dim{color:var(--ink3)}
.sub{color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--agent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--rail);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:700;font-size:22px;letter-spacing:-.02em}
.brand small{font-family:var(--font-b);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.clock{font-family:var(--font-m);font-size:13px;color:var(--ink2);min-width:92px}
.ctl{display:flex;gap:6px;align-items:center}
.gauges{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.gauge{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;font-size:13px}
.pips{display:flex;gap:3px}
.pip{width:8px;height:14px;border-radius:2px;background:var(--line)}
.pip.on{background:var(--agent)}
.gauge.you{border-color:var(--you-fill);background:var(--you-bg);color:var(--you);font-weight:600}
.btn{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.btn.you{background:var(--you-fill);color:var(--on-you);border-color:var(--you-fill);font-weight:600}
.btn.sm{min-height:30px;padding:0 9px;font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{min-height:34px;padding:0 10px;border:0;background:transparent;cursor:pointer;font-family:var(--font-m);font-size:12px}
.seg button.on{background:var(--ink);color:var(--bg)}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);align-items:start;min-height:calc(100vh - 53px);background:linear-gradient(to right,var(--rail) 0 231px,var(--line) 231px 232px,transparent 232px)}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);align-self:start;max-height:calc(100vh - 53px);overflow:auto;
  padding:16px 12px 24px;display:flex;flex-direction:column;gap:18px}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navlbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:0 8px 4px}
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;padding:0 8px;border:0;border-radius:6px;background:transparent;cursor:pointer;text-align:left;color:var(--ink2);width:100%}
.navbtn:hover{background:var(--line2);color:var(--ink)}
.navbtn.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.navbtn.subnav{padding-left:20px;min-height:32px;font-size:13px}
.badge{font-size:11px;font-weight:600;border-radius:9px;padding:0 7px;line-height:18px;background:var(--line2);color:var(--ink2);font-variant-numeric:tabular-nums}
.badge.you{background:var(--you-fill);color:var(--on-you)}
.badge.agent{background:var(--agent-bg);color:var(--agent)}
main{min-width:0;padding-block:24px 56px;padding-inline:24px;display:flex;flex-direction:column;gap:24px}
@media (max-width:860px){
  .top{position:static}
  .gauges{margin-left:0}
  .shell{grid-template-columns:minmax(0,1fr);background:none;min-height:0}
  nav.rail{position:static;max-height:none;border-bottom:1px solid var(--line);background:var(--rail);gap:8px;padding:10px 16px}
  .navgrp{flex-direction:row;flex-wrap:nowrap;gap:4px;align-items:center;overflow-x:auto;padding-bottom:2px}
  .navlbl{padding:0 4px 0 0;flex:none}
  .navbtn{width:auto;flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--panel)}
  .navbtn.subnav{padding-left:8px}
  main{padding-inline:16px;padding-block:16px 40px}
  h1{font-size:24px}
}

/* page pieces */
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.head .t{display:flex;flex-direction:column;gap:4px;max-width:70ch;min-width:0}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--font-m);font-size:12px;color:var(--ink3)}
.crumb button{border:0;background:none;padding:0;cursor:pointer;color:var(--agent);font:inherit}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.sect{display:flex;flex-direction:column;gap:12px;min-width:0}
.sect>.sh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel.flat{background:transparent}
.panel.you{border-color:var(--you-fill)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.big{font-family:var(--font-d);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:13px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--ink2)}
.bar.agent>i{background:var(--agent)} .bar.you>i{background:var(--you-fill)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--agent);flex:none}
.dot.live{animation:pulse 1.4s ease-in-out infinite}
.sq{width:8px;height:8px;background:var(--you-fill);flex:none}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.st.agent{color:var(--agent)} .st.you{color:var(--you);font-weight:600} .st.ok{color:var(--ok)} .st.bad{color:var(--bad)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 6px;line-height:18px;color:var(--ink2);white-space:nowrap}
.tag.dash{border-style:dashed}
.tag.you{border-color:var(--you-fill);color:var(--you)}
.empty{color:var(--ink3);font-size:13px;padding:6px 0}
.scrollx{overflow-x:auto}

/* board */
.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;min-width:860px}
.colh{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding-bottom:6px;border-bottom:1px solid var(--line)}
.colh.you{color:var(--you);border-color:var(--you-fill)}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{display:flex;flex-direction:column;gap:5px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 11px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--ink3)}
.card.you{border-color:var(--you-fill)}
.card.dash{border-style:dashed}
.card .ttl{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card .goal{font-size:12.5px;color:var(--ink2);line-height:1.35}
.card .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink3);align-items:center;flex-wrap:wrap}
.mini{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--ink2);padding:6px 9px;border:1px solid var(--line2);border-radius:6px;background:transparent;cursor:pointer;text-align:left;width:100%}
.mini:hover{border-color:var(--ink3)}
.lane{display:flex;flex-direction:column;gap:8px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:12px;min-width:860px}
.lane .cols{min-width:0}

/* tables */
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:500;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
td .ttl{font-weight:500}

/* log */
.log{background:var(--log);color:var(--log-ink);border-radius:8px;padding:12px 14px;font-family:var(--font-m);font-size:12px;line-height:1.6;max-height:420px;overflow:auto;border:1px solid var(--line)}
.log div{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px}
.log .tm{color:var(--log-dim)}
.log .tx{overflow-wrap:anywhere}
.log .sys .tx{color:var(--log-dim)} .log .cmd .tx::before{content:"$ ";color:var(--log-dim)}
.log .tool .tx{color:#8FC7F5} .log .chk .tx{color:#7FDDB7} .log .warn .tx{color:#F5C46B}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--ink2)}
input[type=text],textarea,select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-height:36px;width:100%}
textarea{resize:vertical}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
.step button{width:34px;min-height:34px;border:0;background:transparent;cursor:pointer;font-size:16px}
.step button:hover{background:var(--line2)}
.step span{min-width:30px;text-align:center;font-family:var(--font-m);font-size:13px}
details.panel{padding:6px 16px}
details.panel[open]{padding:6px 16px 14px;gap:10px}
details>summary{cursor:pointer;color:var(--agent);font-weight:500;min-height:30px;display:flex;align-items:center}

/* charts */
.chart{display:flex;flex-direction:column;gap:8px}
.vbars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line);padding-top:6px}
.vbars .b{flex:1;max-width:34px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;min-width:0}
.vbars .b i{display:block;background:var(--bar);border-radius:4px 4px 0 0;min-height:1px}
.vbars .b:hover i{background:var(--ink)}
.vx{display:flex;gap:2px;font-family:var(--font-m);font-size:10.5px;color:var(--ink3)}
.vx span{flex:1;max-width:34px;text-align:center;min-width:0;overflow:hidden}
.hbars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center;font-size:13px}
.hbars .trk{height:14px;position:relative}
.hbars .trk i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:1px}
.hbars .trk:hover i{background:var(--ink)}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--font-b);font-size:12px;line-height:1.3;padding:4px 8px;border-radius:4px;white-space:nowrap;z-index:5;pointer-events:none}
.track{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.track span{padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--ink3)}
.track span.past{color:var(--ink2);background:var(--line2)}
.track span.now{background:var(--agent-bg);color:var(--agent);border-color:var(--agent);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;z-index:40;max-width:calc(100vw - 32px)}

/* ---- second version: tickets, subtasks, prompts, documentation, crew level ---- */
.small{font-size:12.5px}
.lnk{border:0;background:none;padding:0;cursor:pointer;color:var(--agent);font:inherit;text-decoration:underline;text-underline-offset:2px}
.lnk.mono{font-family:var(--font-m);font-size:12px}
.key{font-family:var(--font-m);font-size:12px;color:var(--ink2);white-space:nowrap}
.hkey{font-family:var(--font-m);font-size:.62em;font-weight:500;color:var(--ink3);letter-spacing:0;vertical-align:.18em;margin-right:4px}
.chip{display:inline-block;font-family:var(--font-m);font-size:11px;line-height:18px;padding:0 6px;border-radius:4px;background:var(--line2);color:var(--ink2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.kind{display:inline-block;font-size:11px;line-height:17px;padding:0 6px;border-radius:9px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.kind.k-fix{border-color:var(--bad);color:var(--bad)} .kind.k-docs{border-color:var(--ok);color:var(--ok)} .kind.k-chore{border-style:dashed}
.st.ready{color:var(--ok)} .st.dim{color:var(--ink3)}
.boardwrap{overflow-x:auto;padding-bottom:8px}
.cols{grid-template-columns:repeat(var(--n,5),minmax(198px,1fr));min-width:0;align-items:start}
.colh.opt{border-bottom-style:dashed}
.colh.opt>span:first-child::after{content:" · optional";text-transform:none;letter-spacing:0;color:var(--ink3)}
.card .bar{height:3px}
.pcard .pcs{display:flex;flex-wrap:wrap;gap:4px}
.pc{display:inline-flex;gap:5px;align-items:baseline;font-size:11.5px;color:var(--ink2);border:1px solid var(--line2);border-radius:4px;padding:1px 6px}
.pc.z{color:var(--ink3);border-style:dashed} .pc b{color:var(--ink)} .pc.z b{color:var(--ink3);font-weight:400}
.stagebar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.stagebar span{padding:2px 9px;border-radius:10px;border:1px solid var(--line);color:var(--ink2);background:var(--panel)}
.stagebar span.opt{border-color:var(--agent);color:var(--agent);background:var(--agent-bg)}
.stagebar span.off{border-style:dashed;color:var(--ink3);background:transparent;text-decoration:line-through}
.stagebar i{color:var(--ink3);font-style:normal}
.track span.skip{text-decoration:line-through;border-style:dashed}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1180px){.split{grid-template-columns:minmax(0,1fr)}}
.panel.now{border-color:var(--agent);box-shadow:inset 0 0 0 1px var(--agent)}
.panel.now.you{border-color:var(--you-fill);box-shadow:inset 0 0 0 1px var(--you-fill)}
.nowgrid{grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:14px 20px}
.kv.wide{grid-template-columns:minmax(70px,auto) minmax(0,1fr)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13px}
.steps li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;align-items:baseline;color:var(--ink3)}
.steps li.done{color:var(--ink2)} .steps li.cur{color:var(--ink);font-weight:600}
.steps .tick{font-family:var(--font-m);color:var(--agent);text-align:center}
.steps li.done .tick,.steps li.ok .tick{color:var(--ok)} .steps li.bad .tick{color:var(--bad)}
.steps.checks li{color:var(--ink2)}
pre.txt{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--font-m);font-size:12px;line-height:1.6;color:var(--ink);background:var(--panel2);border:1px solid var(--line2);padding:10px 12px;border-radius:6px;max-height:340px;overflow:auto}
pre.txt.tall{max-height:640px}
.pp{border:1px solid var(--line2);border-radius:6px;padding:0 10px}
.pp[open]{padding-bottom:10px}
.pp>summary,.pp.none,.pp.msgp{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;min-height:34px;padding-block:6px}
.pp>summary{cursor:pointer;color:inherit;font-weight:400}
.pp .pn{font-weight:600;color:var(--ink);min-width:132px}
.pp.none{color:var(--ink3)} .pp.none .pn{color:var(--ink3);font-weight:500}
.pp.msgp{border-color:var(--you-fill)} .pp.msgp pre{flex-basis:100%}
.pp pre.txt{margin-top:2px}
blockquote.quote{margin:0;border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--ink);font-size:13.5px}
tr.sel td{background:var(--agent-bg)}
tr.child td{color:var(--ink2);font-size:12.5px;background:var(--panel2)}
tr.offrow td{opacity:.62}
.rec{border-top:1px solid var(--line2);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.rec:first-child{border-top:0;padding-top:0}
.feed{display:flex;flex-direction:column}
.feed .ev{display:grid;grid-template-columns:44px 64px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px;align-items:baseline}
.ty{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.ty-run{color:var(--agent)} .ty-you,.ty-warn{color:var(--you);font-weight:600} .ty-check{color:var(--ok)}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{min-height:38px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;color:var(--ink2);font-weight:500;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.btn.sw{min-width:52px;font-family:var(--font-m);font-size:12px}
.btn.sw.on{background:var(--agent);border-color:var(--agent);color:var(--panel)}
.docgrid{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.docgrid{grid-template-columns:minmax(0,1fr)}}
.tree{gap:2px;padding:8px}
.tree .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:8px 8px 2px}
.doc{max-width:70ch;display:flex;flex-direction:column;gap:10px;line-height:1.6;font-size:14.5px}
.doc h2{font-size:22px} .doc h3{margin-top:6px}
.doc ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:60ch;padding:9px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);font-size:13.5px;align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--you-bg);border-color:var(--you-fill)}
.msg .who{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.diff{font-family:var(--font-m);font-size:12px;line-height:1.65;border:1px solid var(--line2);border-radius:6px;overflow:auto;background:var(--panel2)}
.diff div{padding:0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.diff .a{background:var(--add)} .diff .d{background:var(--del)} .diff .h{color:var(--ink3)}
.hbars>span:first-child{overflow-wrap:anywhere}
select{max-width:100%}
@media (max-width:560px){.feed .ev{grid-template-columns:40px minmax(0,1fr)}.feed .ev .ty{display:none}}

.nw{white-space:nowrap}
.boardwrap{scrollbar-width:thin}
.cols{min-width:min-content}
nav.rail{gap:12px;padding-top:12px}
.navbtn{min-height:32px}
.navbtn.subnav{min-height:28px}
.navlbl{padding-bottom:2px}
@media (max-width:860px){.navbtn,.navbtn.subnav{min-height:34px}}
.colh.opt.narrow>span:first-child::after{content:""}
.colh{gap:6px;white-space:nowrap}
.kv select{min-width:min(190px,100%)}
/* ---- third version: agent CLIs, microVMs, quotas, versions ---- */
.chip b{font-weight:600;color:var(--ink)}
.steps.checks .tick{color:var(--ink3)}
.steps.checks li.ok .tick{color:var(--ok)} .steps.checks li.bad .tick{color:var(--bad)}
.gauge .mono{font-family:var(--font-m);font-size:12px}
.kv .seg{display:inline-flex}
.seg{flex-wrap:wrap}
td .chip{max-width:230px}
/* ---- fourth version: terminal on a ticket, git ---- */
.log.term div{grid-template-columns:minmax(0,1fr)}
.log.term .pr{color:#7FDDB7}
.log.term .cur{color:var(--log-dim)}
.log.tall{max-height:520px;min-height:260px}
.pp.df>summary{justify-content:space-between}
.diff{max-width:100%}
/* ---- fifth version: version by the logo, notifications, hosting ---- */
.brand .ver{font-family:var(--font-m);font-size:12px;font-weight:500;letter-spacing:0;line-height:20px;border:1px solid var(--line);border-radius:4px;padding:0 7px;background:var(--panel);color:var(--ink2);cursor:pointer;white-space:nowrap}
.brand .ver:hover{border-color:var(--ink3);color:var(--ink)}
.chatcard{border:1px solid var(--line);border-left:3px solid var(--agent);border-radius:8px;padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:8px;min-width:0}
.st.small{font-size:12.5px}

.rwnote{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line2);font-size:12px;color:var(--ink2);white-space:normal}
.rwnote details{margin-top:4px}
.rwnote summary{cursor:pointer;color:var(--ink3)}

.selmenu{position:fixed;z-index:60;display:flex;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.28)}
.selmenu[hidden]{display:none}
/* ---- software factory (design 1.47): visual factory line, Slack-like rooms, dreamstore, YAML ---- */
.fline{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px;align-items:stretch;overflow-x:auto;padding-bottom:6px}
.fnode{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-width:130px;position:relative}
.fnode.on{border-color:var(--agent);box-shadow:inset 0 0 0 1px var(--agent)}
.fnode.you{border-color:var(--you-fill);box-shadow:inset 0 0 0 1px var(--you-fill)}
.fbranch{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:stretch}
@media (max-width:900px){.fline{grid-template-columns:repeat(3,minmax(160px,1fr))}.fbranch{grid-template-columns:minmax(0,1fr)}}
.slack{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.slack{grid-template-columns:minmax(0,1fr)}}
.schans{display:flex;flex-direction:column;gap:2px;padding:8px}
.schans .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:8px 8px 3px}
.smain{display:flex;flex-direction:column;gap:10px;min-width:0}
.sfeed{display:flex;flex-direction:column;gap:8px;max-height:460px;overflow:auto;padding-right:2px}
.smsg{border:1px solid var(--line2);border-radius:8px;padding:9px 12px;background:var(--panel);display:flex;flex-direction:column;gap:4px}
.smsg.me{border-color:var(--you-fill);background:var(--you-bg)}
.smsg.res{border-color:var(--agent);background:var(--agent-bg)}
.smsg .shead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;font-size:12px}
.smsg .swho{font-weight:600}
.mtag{display:inline-block;padding:0 5px;border-radius:4px;font-family:var(--font-m);font-size:11.5px;background:var(--agent-bg);color:var(--agent);font-weight:500}
.mtag.u{background:var(--you-bg);color:var(--you)}
.vscore{display:inline-flex;align-items:center;gap:6px;min-width:110px}
.vbar{width:64px;height:6px;border-radius:3px;background:var(--line2);overflow:hidden;display:inline-block}
.vbar>i{display:block;height:100%;border-radius:3px}
.yamlbox{font-family:var(--font-m);font-size:11.5px;line-height:1.55;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:10px 12px;white-space:pre-wrap;overflow:auto;max-height:280px}

  return steps.length ? '<ul class="steps">' + steps.map((s, i) => '<li class="' + (s.done ? 'done' : i === cur ? 'cur' : '') + '"><span class="tick">' + (s.done ? '✓' : i === cur ? '›' : '') + '</span><span>' + esc(s.text) + '</span></li>').join('') + '</ul>' : '';
}
function logHtml(lines, id){

function promptText(parts){ return parts.filter(x => x.text).map(x => '## ' + x.part + (x.src ? '   (' + x.src + (x.ver ? ', ' + x.ver : '') + ')' : '') + '\n' + x.text).join('\n\n'); }
function promptHtml(r, mode, open){

  if (w.kind === 'review') return '<div class="panel you">' + head + '<div class="dim small">What you selected</div><p class="small" style="white-space:pre-line;margin:4px 0 8px">' + esc(w.orig) + '</p><div class="dim small">Notes. Nothing was changed.</div><ul class="small" style="margin:4px 0;padding-left:18px">' + w.notes.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul><div class="row">' + act('Close', 'rwdrop', {id:d.id}, 'sm') + '</div><p class="dim small">Review text changes nothing. You change the text yourself, and send it when it is right.</p></div>';

  const two = '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px"><div><div class="dim small">' + (w.kind === 'improve' ? 'What you selected' : 'Your text') + '</div><p class="small" style="white-space:pre-line;margin:4px 0">' + esc(w.orig) + '</p></div>' +

      table(['', 'CLI, model, effort', 'Runs', 'Passed', 'Rounds', 'Cost', 'Min'], row(nowTo ? 'Before' : 'Now', r.from, r.fe, r.a) + row(nowTo ? 'Now' : r.state === 'open' ? 'Crew\'s pick' : 'Other', r.to, r.te, r.b), '') +

function dbStats(){

  const subs = S.projects.flatMap(p => p.tasks.flatMap(t => t.subs).concat(p.runs)), runs = subs.filter(s => s.run);
  const ev = runs.reduce((a, s) => a + n(s.log), 0) + S.convs.reduce((a, c) => a + n(c.log), 0);
  const turns = runs.reduce((a, s) => a + (s.turns || 0), 0) + S.convs.reduce((a, c) => a + c.turns, 0);
  const tickets = sum(p => p.tasks.length), moves = sum(p => p.tasks.reduce((a, t) => a + n(t.hist), 0));

  return {ev, turns, tickets, subs:subs.length, runs:runs.length, moves, recs, dreamChat,
    know:sum(p => n(p.memory) + n(p.bugs) + n(p.feedback) + n(p.evals && p.evals.cases) + n(p.evals && p.evals.runs)),
    crew:n(S.crew.signals) + n(S.crew.imps) + n(S.crew.rels), deploys:sum(p => n(p.host && p.host.deploys)), op:n(S.tokens) + n(S.mcp) + n(S.notes),
